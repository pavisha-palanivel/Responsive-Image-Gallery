<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Image Gallery</title>
  <link rel="stylesheet" href="style1.css"/>
</head>

<body>
  <h1>📸 Responsive Image Gallery</h1>
  <div class="filter-btns">
    <button data-filter="all">All</button>
    <button data-filter="nature">Nature</button>
    <button data-filter="flowers">Flower</button>
    <button data-filter="animals">Animal</button>
    <button data-filter="birds">Bird</button>
  </div>

  <div class="gallery">
    <div class="gallery-item" data-category="nature">
      <img src="images/nature1.jpg" alt="Nature 1">
    </div>
    <div class="gallery-item" data-category="nature">
      <img src="images/nature2.jpg" alt="Nature 2">
    </div>

    <div class="gallery-item" data-category="flowers">
      <img src="images/flower1.jpg" alt="Flower 1">
    </div>
    <div class="gallery-item" data-category="flowers">
      <img src="images/flower2.jpg" alt="Flower 2">
    </div>

    <div class="gallery-item" data-category="animals">
      <img src="images/animal1.jpg" alt="Dog">
    </div>
    <div class="gallery-item" data-category="animals">
      <img src="images/animal2.jpg" alt="Rabbit">
    </div>

    <div class="gallery-item" data-category="birds">
      <img src="images/bird1.jpg" alt="Peacock">
    </div>
    <div class="gallery-item" data-category="birds">
      <img src="images/bird2.jpg" alt="Parrot">
    </div>
  </div>

  <div class="lightbox">
    <span class="close">&times;</span>
    <span class="prev">&#10094;</span>
    <img src="" alt="">
    <span class="next">&#10095;</span>
  </div>
  <script src="script1.js"></script>
</body>
</html>
